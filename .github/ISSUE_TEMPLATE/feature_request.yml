name: Feature request
description: Propose an addition to Cursus
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Smallest change that solves it.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals check
      description: Which README/PRD non-goal does this touch, if any, and why should the boundary move?
    validations:
      required: true
