name: Publish SDK

# Publishes sagea-cursus to PyPI when a GitHub release is cut.
#
# One-time setup (PyPI, trusted publishing — no long-lived token needed):
#   1. On pypi.org, add a "pending publisher" for this repo:
#      owner/repo = the GitHub org + repo, workflow file = publish.yml,
#      environment = (none).
#   2. Bump sdk/pyproject.toml `version` to the release version.
#   3. Cut a GitHub release. This workflow builds the sdist+wheel, runs the
#      unit suite once more for safety, and uploads via OIDC.
#
# For a dry run without uploading: Actions → Publish SDK → Run workflow.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build backend + dev deps
        run: |
          pip install build
          pip install -e ".[dev]"

      - name: SDK unit tests
        run: pytest -q -m "not integration"

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
