# Postgres 16+ is required, not optional.
#
# Local dev (db only, app on host):        `docker compose up -d db`
# Full self-host cold start (db+migrate):  `docker compose --profile selfhost up --build`
# (app/migrate are on the `selfhost` profile so plain `up -d db` never
# demands SESSION_SECRET.)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cursus
      POSTGRES_PASSWORD: cursus
      POSTGRES_DB: cursus
    ports:
      - "5432:5432"
    volumes:
      - cursus-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cursus -d cursus"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for large bytes (media). Self-hosts via
  # RustFS here; point S3_* at AWS/R2/GCS-XML instead to bring your own.
  # The server self-provisions the bucket on first use (no init container).
  # Local dev (app on host): `docker compose up -d db rustfs`.
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-cursus}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-cursus-rustfs-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cursus-rustfs:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # One-shot schema migration; app waits for it (no manual `prisma migrate`).
  migrate:
    profiles: ["selfhost"]
    build:
      context: .
      target: builder
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cursus:cursus@db:5432/cursus?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]

  app:
    profiles: ["selfhost"]
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      rustfs:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://cursus:cursus@db:5432/cursus?schema=public}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set (see .env.example)}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL must be set (see .env.example)}
      BOOTSTRAP_ORG_NAME: ${BOOTSTRAP_ORG_NAME:-cursus}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://rustfs:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-cursus-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${RUSTFS_ACCESS_KEY:-cursus}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${RUSTFS_SECRET_KEY:-cursus-rustfs-secret}}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    ports:
      - "3000:3000"

volumes:
  cursus-pgdata:
  cursus-rustfs:
