# Postgres 16+ is required, not optional.
#
# Local dev (db only, app on host):        `docker compose up -d db`
# Full self-host cold start (db+migrate):  `docker compose --profile selfhost up --build`
# (app/migrate are on the `selfhost` profile so plain `up -d db` never
# demands SESSION_SECRET.)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cursus
      POSTGRES_PASSWORD: cursus
      POSTGRES_DB: cursus
    ports:
      - "5432:5432"
    volumes:
      - cursus-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cursus -d cursus"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for large bytes (media). Self-hosts via
  # MinIO here; point S3_* at AWS/R2/GCS-XML instead to bring your own.
  # The server self-provisions the bucket on first use (no init container).
  # Local dev (app on host): `docker compose up -d db minio`.
  minio:
    # Quay is MinIO's official registry (Docker Hub builds are retired).
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cursus}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cursus-minio-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cursus-minio:/data
    # No healthcheck: the minio image is shell-less. Startup ordering via
    # service_started below is enough — the server retries bucket setup.

  # One-shot schema migration; app waits for it (no manual `prisma migrate`).
  migrate:
    profiles: ["selfhost"]
    build:
      context: .
      target: builder
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cursus:cursus@db:5432/cursus?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]

  app:
    profiles: ["selfhost"]
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://cursus:cursus@db:5432/cursus?schema=public}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set (see .env.example)}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?BOOTSTRAP_ADMIN_EMAIL must be set (see .env.example)}
      BOOTSTRAP_ORG_NAME: ${BOOTSTRAP_ORG_NAME:-cursus}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-cursus-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-cursus}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-cursus-minio-secret}}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    ports:
      - "3000:3000"

volumes:
  cursus-pgdata:
  cursus-minio:
